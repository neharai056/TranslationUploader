<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Salesforce Translation Extension</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div id="app">
    <!-- Header Controls -->
    <div class="controls">
      <button id="btnRefresh">Refresh</button>
      <button id="btnSave" class="btn-primary">Save All</button>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs">
      <button id="tabLabels" class="tab-btn active">Custom Labels</button>
      <button id="tabValidation" class="tab-btn">Validation Rules</button>
    </div>

    <!-- Search Box -->
    <div class="search-container">
      <input 
        type="text" 
        id="search-input" 
        placeholder="Search by name..." 
        autocomplete="off"
      />
    </div>

    <!-- Status Message -->
    <div id="status" class="status-msg"></div>

    <!-- Main Content Area -->
    <div id="content"></div>
  </div>

  <!-- Scripts -->
  <script src="lib/jszip.min.js"></script>
  <script src="lib/sfSession.js"></script>
  <script src="lib/toolingApi.js"></script>
  <script src="lib/metadataApi.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
